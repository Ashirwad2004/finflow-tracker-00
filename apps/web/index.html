<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!--
    Theme, before first paint.

    `.dark` was only ever applied from React: `ThemeInitializer` runs in a
    `useLayoutEffect`, which cannot happen until the bundle has downloaded,
    parsed and mounted. Until then the document painted with the light tokens,
    so every load for a dark-mode visitor flashed a full white page and then
    snapped to dark. On the landing route that is a 1.2MB chunk's worth of
    waiting, and on a shop's connection it is plainly visible.

    This has to be a blocking inline script this early in `<head>`: anything
    deferred, module-type or bundled runs after the first paint, and so cannot
    prevent the flash. It is tiny and dependency-free for the same reason.

    The default when nothing is stored is "light", which is exactly what
    `getPreferredTheme()` returns - this script must not disagree with it, or
    the page would flip theme a moment after loading. React still applies the
    class itself afterwards; this only makes the first paint agree with it.
  -->
  <script>
    (function () {
      try {
        var stored = localStorage.getItem("theme");
        var theme = stored === "dark" || stored === "light" ? stored : "light";
        var root = document.documentElement;
        root.classList.remove("light", "dark");
        root.classList.add(theme);
        // Also styles native scrollbars and form controls from the first paint.
        root.style.colorScheme = theme;
      } catch (e) {
        /* Private mode or blocked storage: light is the documented default. */
      }
    })();
  </script>
  <title>RupeeBill — All-in-One Invoicing, Inventory &amp; Business Management</title>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
  <script>
    if ("serviceWorker" in navigator) {
      const isLocalhost = window.location.hostname === "localhost" || window.location.hostname === "127.0.0.1";

      if (isLocalhost) {
        // Automatically clean up service workers on localhost to prevent hijacking development
        navigator.serviceWorker.getRegistrations().then((registrations) => {
          for (const registration of registrations) {
            registration.unregister().then((success) => {
              if (success) {
                console.log("[PWA] Unregistered active service worker on localhost");
                window.location.reload();
              }
            });
          }
        });
      } else {
        window.addEventListener("load", () => {
          navigator.serviceWorker
            .register("/sw.js")
            .then((reg) => {
              console.log("[PWA] Service Worker registered:", reg.scope);

              reg.onupdatefound = () => {
                const installingWorker = reg.installing;
                if (installingWorker) {
                  installingWorker.onstatechange = () => {
                    if (installingWorker.state === "installed" && navigator.serviceWorker.controller) {
                      console.log("[PWA] New version available, reloading page...");
                      window.location.reload();
                    }
                  };
                }
              };
            })
            .catch((err) => console.error("[PWA] Service Worker registration failed:", err));
        });

        // Reload page when the active service worker changes
        let refreshing = false;
        navigator.serviceWorker.addEventListener("controllerchange", () => {
          if (!refreshing) {
            refreshing = true;
            window.location.reload();
          }
        });
      }
    }
  </script>
